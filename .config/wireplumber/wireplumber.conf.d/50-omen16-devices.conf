# OMEN 16-b0xxx: human device names + hide outputs that can never play.
# What apps (Meet, Discord, Firefox, pavucontrol) show comes from node.description.

monitor.alsa.rules = [
  # Intel SOF card (ALC245 codec + DMIC array)
  {
    matches = [ { device.name = "alsa_card.pci-0000_00_1f.3-platform-skl_hda_dsp_generic" } ]
    actions = { update-props = { device.description = "Laptop Audio" } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink" } ]
    actions = { update-props = { node.description = "Laptop Speakers"  node.nick = "Laptop Speakers" } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Headphones__sink" } ]
    actions = { update-props = { node.description = "Headphones (3.5 mm jack)"  node.nick = "Headphones" } }
  }
  {
    matches = [ { node.name = "alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Mic1__source" } ]
    # 2020 > Bluetooth headset mic (2010): with earbuds connected, calls keep the buds in A2DP
    # (full-quality audio) and use this DeepFilterNet-cleaned mic instead of the 16/32 kHz HFP mic.
    actions = { update-props = { node.description = "Laptop Microphone"  node.nick = "Laptop Microphone"  priority.session = 2020  priority.driver = 2020 } }
  }
  {
    matches = [ { node.name = "alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Mic2__source" } ]
    # a plugged-in wired headset always wins
    actions = { update-props = { node.description = "Headset Microphone (3.5 mm jack)"  node.nick = "Headset Mic"  priority.session = 2100  priority.driver = 2100 } }
  }
  # Intel HDMI/DP 1-3: in BIOS discrete-GPU mode every external display hangs off the NVIDIA GPU, so
  # these three iGPU outputs are permanently dead entries. Delete this rule if a USB-C/Thunderbolt
  # monitor ever needs audio through the iGPU.
  {
    matches = [
      { node.name = "~alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__HDMI*" }
    ]
    actions = { update-props = { node.disabled = true } }
  }
  # NVIDIA GA106 HDMI audio = the external monitor's speakers / audio out
  {
    matches = [ { device.name = "alsa_card.pci-0000_01_00.1" } ]
    actions = { update-props = { device.description = "NVIDIA HDMI Audio" } }
  }
  {
    matches = [ { node.name = "~alsa_output.pci-0000_01_00.1.*" } ]
    actions = { update-props = { node.description = "Monitor Speakers (HDMI)"  node.nick = "Monitor (HDMI)" } }
  }
  # Fantech Leviosa Aura = USB microphone. Its "Analog Stereo" sink is only the mic's headphone
  # monitor jack, but USB priority (1109) beat the laptop speakers (1000), so audio vanished into it
  # whenever the earbuds disconnected. Below the speakers it is never an automatic fallback; it can
  # still be picked by hand. The mic source is left alone.
  {
    matches = [ { node.name = "alsa_output.usb-JinAudio_Fantech_Leviosa_Aura_AP5980_20241018-00.analog-stereo" } ]
    actions = { update-props = { node.description = "Fantech Mic (headphone jack)"  node.nick = "Fantech jack"  priority.session = 500  priority.driver = 500 } }
  }
  # High-quality sample-rate conversion on every ALSA device node (default quality is 4)
  {
    matches = [ { node.name = "~alsa_.*" } ]
    actions = { update-props = { resample.quality = 10 } }
  }
]

monitor.bluez.properties = {
  # SBC-XQ (~552 kbps dual-channel SBC) for earbuds without AAC/LDAC; mSBC + LC3-SWB wideband calls
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
}
