# OMEN by HP Laptop 16-b0xxx (board 88FD) — in-node DSP for the internal speakers and DMIC array.
#
# Uses WirePlumber "internal filter graphs" (node.filter-graph.rules): the processing runs inside
# the ALSA node's audioconvert, so apps see the normal device and no extra virtual sinks/sources
# exist. Headphones / HDMI / Bluetooth are untouched because only these two node names match.
#
# Speaker EQ: fitted 2026-10-09 from log-sweep + pink-noise RTA measurements of the raw speakers
# (internal DMIC) against Notebookcheck's pink-noise response of the 16-b0085ng under Windows
# (B&O tuning), then refined closed-loop through this exact chain. Residual vs. that target over
# the bands with usable SNR (400 Hz - 10 kHz): 5.9 dB RMS raw -> ~1 dB predicted after refinement. Fit + data: vault note
# 00_estus/homunculi/2026-10-09-omen16-linux-audio.md
#
# Plugins: bankstown (~/.lv2, built from github.com/chadmed/bankstown), LSP limiter (lsp-plugins-lv2),
# DeepFilterNet 0.5.6 LADSPA (~/.ladspa). Disable a graph by commenting its rule and running
#   systemctl --user restart wireplumber

node.filter-graph.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink" }
    ]
    actions = {
      create-filter-graph = [
        {
          nodes = [
            # Psychoacoustic bass: content the 2 small drivers can't move (< ~220 Hz) is replaced by
            # its 2nd/3rd harmonics, then the original sub-bass is high-passed away (less excursion,
            # less distortion, more clean volume).
            {
              type = lv2
              name = bass
              plugin = "https://chadmed.au/bankstown"
              control = {
                amt = 1.4
                sat_second = 1.3
                sat_third = 2.0
                blend = 0.6
                floor = 30.0
                ceil = 220.0
                final_hp = 160.0
              }
            }
            # Measured correction: tames the +10 dB 800-1250 Hz "honk" and the 6-8 kHz glare,
            # fills the 250-400 Hz and 2.5-4.5 kHz holes (net boost capped at +6.5 dB).
            {
              type = builtin
              name = eq
              label = param_eq
              config = {
                filters = [
                  { type = bq_highpass,  freq = 150.0,  q = 0.7071 }
                  { type = bq_lowshelf,  freq = 343.8  , gain = 6.46  , q = 0.707 }
                  { type = bq_peaking,   freq = 404.9  , gain = 5.28  , q = 1.748 }
                  { type = bq_peaking,   freq = 779.8  , gain = -11.03, q = 3.981 }
                  { type = bq_peaking,   freq = 1110.0 , gain = -10.38, q = 2.999 }
                  { type = bq_peaking,   freq = 3836.5 , gain = 6.0   , q = 1.739 }
                  { type = bq_peaking,   freq = 6265.7 , gain = -7.98 , q = 3.0 }
                  { type = bq_peaking,   freq = 8097.1 , gain = -7.0  , q = 3.0 }
                  { type = bq_highshelf, freq = 8000.0 , gain = -4.48 , q = 0.707 }
                ]
              }
            }
            # Brickwall at -1 dBFS with +3 dB drive (makes up for the 800 Hz cut; "Audio Boost").
            {
              type = lv2
              name = lim
              plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
              control = {
                g_in = 1.413
                th = 0.891
                lk = 5.0
                at = 5.0
                rt = 10.0
                ovs = 22
              }
            }
          ]
          links = [
            { output = "bass:out_l"  input = "eq:In 1" }
            { output = "bass:out_r"  input = "eq:In 2" }
            { output = "eq:Out 1"    input = "lim:in_l" }
            { output = "eq:Out 2"    input = "lim:in_r" }
          ]
          inputs = [ "bass:in_l" "bass:in_r" ]
          outputs = [ "lim:out_l" "lim:out_r" ]
        }
      ]
    }
  }
  {
    matches = [
      { node.name = "alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Mic1__source" }
    ]
    actions = {
      create-filter-graph = [
        {
          nodes = [
            # Sum the two array mics (uncorrelated self-noise drops ~3 dB), cut fan rumble below 90 Hz.
            {
              type = builtin
              name = mix
              label = mixer
              control = { "Gain 1" = 0.5  "Gain 2" = 0.5 }
            }
            {
              type = builtin
              name = hpf
              label = bq_highpass
              control = { "Freq" = 90.0  "Q" = 0.7071 }
            }
            # DeepFilterNet3: neural full-band (48 kHz) speech enhancement. Removes fan/keyboard noise.
            {
              type = ladspa
              name = dfn
              plugin = "libdeep_filter_ladspa"
              label = deep_filter_mono
              control = {
                "Attenuation Limit (dB)" = 40.0
              }
            }
            # +6 dB makeup (hardware DMIC gain was lowered +20 -> +10 dB to stop ADC clipping), then a
            # true-peak brickwall at -1 dBFS so knocks/claps can't exceed full scale in 16-bit apps.
            {
              type = lv2
              name = lim
              plugin = "http://lsp-plug.in/plugins/lv2/limiter_mono"
              control = {
                g_in = 2.0
                th = 0.891
                lk = 2.0
                at = 2.0
                rt = 20.0
                ovs = 22
              }
            }
            { type = builtin  name = out_l  label = copy }
            { type = builtin  name = out_r  label = copy }
          ]
          links = [
            { output = "mix:Out"         input = "hpf:In" }
            { output = "hpf:Out"         input = "dfn:Audio In" }
            { output = "dfn:Audio Out"   input = "lim:in" }
            { output = "lim:out"         input = "out_l:In" }
            { output = "lim:out"         input = "out_r:In" }
          ]
          inputs = [ "mix:In 1" "mix:In 2" ]
          outputs = [ "out_l:Out" "out_r:Out" ]
        }
      ]
    }
  }
]
