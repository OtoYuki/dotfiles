# ── Fonts ────────────────────────────────────────────────────────────────
font_family      GeistMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# GeistMono Nerd Font Mono carries the Nerd icons itself, one cell wide, and has
# normal line metrics: no symbol_map and no cell_height correction needed.
# (0xProto setup kept in kitty.conf.bak-20261010-0xproto.)

# ── Window Layout ────────────────────────────────────────────────────────
# Padding: top right bottom left
window_padding_width 14 16 16 16
background_opacity 1.0
background_blur 0




# ── System ───────────────────────────────────────────────────────────────
shell zsh

# ── Dynamic Theme ────────────────────────────────────────────────────────
include theme.conf