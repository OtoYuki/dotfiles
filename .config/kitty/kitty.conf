# ── Fonts ────────────────────────────────────────────────────────────────
font_family      0xProto Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Force Kitty to use Propo explicitly and ONLY for the Nerd Font icons
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6AA,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F300-U+F32F,U+F400-U+F4A9,U+F500-U+F8FF,U+F0001-U+F1AF0 0xProto Nerd Font Propo

# ── Window Layout ────────────────────────────────────────────────────────
# Padding: top right bottom left
window_padding_width 5 15 15 15

# ── System ───────────────────────────────────────────────────────────────
shell zsh

# ── Gruvbox Dark Hard Theme ──────────────────────────────────────────────
background #1b1b1b
foreground #ebdbb2
selection_background #665c54
cursor #ebdbb2

# Black
color0 #1b1b1b
color8 #928374

# Red
color1 #cc241d
color9 #fb4934

# Green
color2 #98971a
color10 #b8bb26

# Yellow
color3 #d79921
color11 #fabd2f

# Blue
color4 #458588
color12 #83a598

# Purple
color5 #b16286
color13 #d3869b

# Cyan
color6 #689d6a
color14 #8ec07c

# White
color7 #a89984
color15 #ebdbb2