# ~/.config/yazi/yazi.toml

[manager]
ratio          = [ 1, 3, 4 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true

[status]
separator_open  = ""
separator_close = ""

[plugin]
prepend_fetchers = [
	{ id = "git", name = "*", run = "git" },
	{ id = "full-border", name = "*", run = "full-border" },
]

[preview]
max_width     = 1920
max_height    = 1080
image_filter  = "lanczos3"
image_quality = 90