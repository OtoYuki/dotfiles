# ~/.config/yazi/yazi.toml

[mgr]
ratio          = [ 1, 3, 4 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true

[status]
separator_open  = ""
separator_close = ""

# git status signs (plugins/git.yazi); full-border is set up in init.lua
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

[preview]
max_width     = 1920
max_height    = 1080
image_filter  = "lanczos3"
image_quality = 90