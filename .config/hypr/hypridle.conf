general {
    lock_cmd = pidof hyprlock || hyprlock       # Avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # Lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'  # Turn display on after resume
}

# 1. Dim monitor brightness to 10% after 2.5 minutes of inactivity
listener {
    timeout = 150
    on-timeout = ~/.local/bin/idle-dim
    on-resume = ~/.local/bin/idle-undim
}

# 2. Lock screen after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 3. Turn off screen (DPMS) 30 seconds after locking
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 4. Suspend system after 30 minutes of inactivity only when running on battery (never when plugged in)
listener {
    timeout = 1800
    condition_cmd = ! grep -sq 1 /sys/class/power_supply/*/online
    condition_retry = 300
    on-timeout = systemctl suspend
}
