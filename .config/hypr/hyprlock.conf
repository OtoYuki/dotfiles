# ~/.config/hypr/hyprlock.conf
# Bespoke Industrial Telemetry Lockscreen matching takt & Sanctuary aesthetic

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    color = rgba(20, 23, 18, 1.0)
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.75
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# Outer Card Container (Milled Industrial Chassis)
shape {
    monitor =
    size = 460, 360
    color = rgba(20, 23, 18, 0.88)
    rounding = 16
    border_size = 1
    border_color = rgba(216, 166, 100, 0.4)
    position = 0, 0
    halign = center
    valign = center
    zindex = 1
}

# Header Deck Status Badge
label {
    monitor =
    text = cmd[update:10000] echo "● SECURE SESSION // TAKT TELEMETRY"
    color = rgb(153, 146, 8)
    font_size = 10
    font_family = Geist Mono Bold
    position = 0, 135
    halign = center
    valign = center
    zindex = 2
}

# Display Chrono (Time)
label {
    monitor =
    text = $TIME
    color = rgb(255, 253, 236)
    font_size = 68
    font_family = Freigeist Bold
    position = 0, 70
    halign = center
    valign = center
    zindex = 2
}

# Sub-Header Date
label {
    monitor =
    text = cmd[update:1000] date +"%A, %B %d"
    color = rgb(216, 166, 100)
    font_size = 13
    font_family = Geist Mono
    position = 0, 12
    halign = center
    valign = center
    zindex = 2
}

# Input Field (Authentication Pill)
input-field {
    monitor =
    size = 310, 46
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(216, 166, 100, 0.8)
    inner_color = rgba(20, 23, 18, 0.95)
    font_color = rgb(255, 253, 236)
    fade_on_empty = false
    font_family = Geist Mono
    placeholder_text = <span foreground="##8A9A86">ENTER PASSCODE</span>
    hide_input = false
    rounding = 23
    check_color = rgba(179, 170, 10, 0.9)
    fail_color = rgba(232, 85, 38, 0.9)
    fail_text = <span foreground="##E85526">AUTHENTICATION FAILED</span>
    fail_transition = 200
    capslock_color = rgba(232, 85, 38, 0.9)
    position = 0, -48
    halign = center
    valign = center
    zindex = 2
}

# Footer Status & Telemetry
label {
    monitor =
    text = cmd[update:5000] echo "OP: $(whoami | tr '[:lower:]' '[:upper:]')  │  HOST: $(hostname | tr '[:lower:]' '[:upper:]')  │  BAT: $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo '100')%"
    color = rgb(138, 154, 134)
    font_size = 10
    font_family = Geist Mono
    position = 0, -125
    halign = center
    valign = center
    zindex = 2
}
